
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost My Keys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">

        <h1 class="display-1 text-center text-danger">Lost My Keys!</h1>
        <p>I lost my keys yesterday.</p>
        <p>I last saw them at school.</p>
        <p>They have a black keychain.</p>
        <p>Please help me find them!</p>

        <div id="keys" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://static.vecteezy.com/system/resources/thumbnails/019/907/697/small/key-graphic-clipart-design-free-png.png" class="d-block w-50" alt="Keys">
                </div>
                <div class="carousel-item">
                   <img src="https://png.pngtree.com/png-clipart/20241110/original/pngtree-golden-ornate-key-clipart-illustration-free-png-image_16893530.png" class="d-block w-50" alt="Keys">
                </div>
            </div>
            <button class="carousel-control-prev" data-bs-target="#keys" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" data-bs-target="#keys" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <p class="border border-primary p-3 mt-3">
            Reward: 50 cents if you find my keys!
        </p>

        <a href="https://www.google.com/maps" class="btn btn-primary btn-lg">Search</a>
        <button class="btn btn-secondary btn-sm" disabled>Found</button>

        <h2 class="mt-4">Contact Me</h2>
        <form>
            <input type="text" class="form-control mb-2" placeholder="Your Name">
            <input type="text" class="form-control mb-2" placeholder="Where did you see my keys?">
            <button class="btn btn-success" type="submit">Submit</button>
        </form>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
